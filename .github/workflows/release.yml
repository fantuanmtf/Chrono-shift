name: Release

# 在推送 v* 标签时构建 Linux 二进制包并生成 SHA256SUMS。
# 签名由维护者在本地用 PGP 私钥完成 (scripts/sign_release.sh)，
# 然后上传 .asc 到 Releases。
# 注意: 项目目标平台为 Linux；Windows 支持已移除 (v0.0.8.2+)。

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build + Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/security/rust_core/target
          key: release-cargo-${{ hashFiles('client/security/rust_core/Cargo.lock') }}

      - name: Build
        working-directory: client/security/rust_core
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp client/security/rust_core/target/x86_64-unknown-linux-gnu/release/chrono-daemon dist/chrono-daemon-linux-x86_64
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          cp docs/RELEASES.md dist/RELEASES.md
          ( cd dist && find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's|  ./|  |' > SHA256SUMS )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-shift-linux-x86_64
          path: dist/*
